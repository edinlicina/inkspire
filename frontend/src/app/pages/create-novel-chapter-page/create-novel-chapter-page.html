<form class="form" novalidate (submit)="createChapter($event)">
  <label for="title">Chapter Title</label>

  <input id="title" [formField]="form.title" />

  @if (wasFormSubmitted() && form.title().invalid()) {
    @for (error of form.title().errors(); track error) {
      <p class="errorMessage">{{ error.message }}</p>
    }
  }

  <label for="chapterNumber"> Chapter Number </label>

  <input type="number" id="chapterNumber" [formField]="form.chapterNumber" />

  <label for="content"> Content </label>

  <textarea id="content" rows="20" [formField]="form.content"> </textarea>

  @if (wasFormSubmitted() && form.content().invalid()) {
    @for (error of form.content().errors(); track error) {
      <p class="errorMessage">{{ error.message }}</p>
    }
  }

  <app-button type="submit"> Create Chapter </app-button>
</form>
